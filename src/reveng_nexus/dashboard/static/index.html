<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>RevEng Nexus Console</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="header">
    <div class="header-row">
      <a class="brand" href="#/overview" aria-label="RevEng Nexus overview">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 8l10-5 10 5v16l-10 5-10-5z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 3v26" stroke="currentColor" stroke-width="1.2" opacity=".5"/></svg>
        <span class="brand-name">RevEng Nexus</span>
      </a>
      <nav class="primary-nav" aria-label="Sections">
        <a href="#/overview" data-section="overview">Overview</a>
        <a href="#/catalog/providers" data-section="catalog">Catalog</a>
        <a href="#/security" data-section="security">Security</a>
        <a href="#/activity" data-section="activity">Activity</a>
        <a href="#/system/architecture" data-section="system">System</a>
      </nav>
      <div class="header-status" id="header-status" aria-live="polite"></div>
      <div class="header-actions">
        <label class="toggle" title="Re-read the gateway snapshot and audit log every 15 seconds"><input type="checkbox" id="auto-refresh" checked> <span>Auto</span></label>
        <button class="btn" id="refresh-btn" type="button">Refresh</button>
      </div>
    </div>
    <nav class="sub-nav" id="sub-nav" aria-label="Section views" hidden></nav>
  </header>
  <main id="main" tabindex="-1"><p class="loading" role="status">Loading gateway state…</p></main>
  <footer class="footer">Read-only monitor: nothing here can call a tool or change policy. No authentication: reachable only from this machine, but readable by any process running under your user account.</footer>
  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="drawer-title" role="dialog">
    <div class="drawer-head"><h2 id="drawer-title">Details</h2><button class="icon-btn" id="drawer-close" type="button" aria-label="Close details">✕</button></div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
